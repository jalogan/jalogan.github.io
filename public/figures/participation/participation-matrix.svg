<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc">
<title id="title">Event–component participation matrix</title>
<desc id="desc">Four input events and three components. Weights are 4,0,0 in row zero; 2,2,0 in row one; 0,3,1 in row two; 1,1,2 in row three. Row-normalization describes distribution across components for an event; column-normalization describes which events reuse a component.</desc>
